buildscript {
    repositories {
        mavenCentral()
        gradlePluginPortal()
    }

    dependencies {
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
        classpath "org.jetbrains.kotlin:kotlin-serialization:$kotlin_version"
    }
}

plugins {
    id 'xyz.jpenilla.run-paper' version '3.1.0'
    id 'com.gradleup.shadow' version '9.6.1'
}

PluginVersion.updateVersion(providers)
version = PluginVersion.version

allprojects {
    apply plugin: "org.jetbrains.kotlin.jvm"
    apply plugin: "org.jetbrains.kotlin.kapt"
    apply plugin: "org.jetbrains.kotlin.plugin.serialization"

    // All modules now target Paper 1.21.11 / Java 21 only.
    def moduleJvmTarget = '21'
    // Gradle 9 removed top-level JavaPluginConvention compatibility properties.
    java {
        sourceCompatibility = JavaVersion.toVersion(moduleJvmTarget)
        targetCompatibility = JavaVersion.toVersion(moduleJvmTarget)
    }

    repositories {
        mavenCentral()
        maven { url = uri("https://repo.codemc.org/repository/maven-public") }
    }

    dependencies {
        implementation "org.jetbrains.kotlin:kotlin-stdlib:$kotlin_version"
        implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk8:$kotlin_version"
        implementation "org.jetbrains.kotlinx:kotlinx-serialization-json-jvm:$kotlinx_serialization_version"
        implementation "com.google.dagger:dagger:$dagger_version"
        implementation "javax.inject:javax.inject:$javax_inject_version"
        implementation "org.bstats:bstats-bukkit-lite:$bstats_version"

        kapt "com.google.dagger:dagger-compiler:$dagger_version"

        testImplementation "org.jetbrains.kotlin:kotlin-test:$kotlin_version"
        testImplementation "org.spekframework.spek2:spek-dsl-jvm:$spek_version"
        testRuntimeOnly "org.spekframework.spek2:spek-runner-junit5:$spek_version"
        testRuntimeOnly "org.jetbrains.kotlin:kotlin-reflect:$kotlin_version"
    }

    test {
        // Run both existing Spek tests and the new JUnit Jupiter tests.
        useJUnitPlatform()
    }

    // Kotlin 2.4 replaces the deprecated kotlinOptions DSL.
    kotlin {
        compilerOptions {
            jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.fromTarget(moduleJvmTarget)
            optIn.add("kotlin.RequiresOptIn")
        }
    }

    kapt {
        correctErrorTypes = true
        includeCompileClasspath = false
    }
}

dependencies {
    implementation project(':fastcraft-core')
    implementation project(':fastcraft-paper')
    // Dagger 2.60 generates jakarta.inject.Provider references in component factories.
    // Paper does not provide this API; it must be packaged with the plugin.
    implementation 'jakarta.inject:jakarta.inject-api:2.0.1'
}

// Keep the plain JAR disabled; assemble publishes the shaded plugin instead.
// Making jar depend on shadowJar creates a cycle with Kotlin test compilation.
tasks.named('jar') {
    enabled = false
}

tasks.named('assemble') {
    dependsOn tasks.named('shadowJar')
}

shadowJar {
    // Kotlin metadata must reach Shadow's transformer before duplicate filtering.
    filesMatching('META-INF/*.kotlin_module') {
        duplicatesStrategy = DuplicatesStrategy.INCLUDE
    }

    archiveClassifier.set(null)
    archiveVersion.set(archiveVersion.get().replace('+', '-'))

    dependencies {
        subprojects.each {
            include project(it.path)
        }

        include dependency("org.jetbrains.kotlin:kotlin-stdlib")
        include dependency("org.jetbrains.kotlin:kotlin-stdlib-jdk7")
        include dependency("org.jetbrains.kotlin:kotlin-stdlib-jdk8")
        include dependency("org.jetbrains.kotlinx:kotlinx-serialization-core-jvm")
        include dependency("org.jetbrains.kotlinx:kotlinx-serialization-json-jvm")
        include dependency("com.google.dagger:dagger")
        include dependency("javax.inject:javax.inject")
        include dependency("jakarta.inject:jakarta.inject-api")
        include dependency("org.bstats:bstats-bukkit-lite")
    }

    def libPackage = "net.benwoodworth.fastcraft.lib"
    relocate("kotlin", "${libPackage}.kotlin")
    relocate("kotlinx", "${libPackage}.kotlinx")
    relocate("dagger", "${libPackage}.dagger")
    relocate("javax.inject", "${libPackage}.javax.inject")
    relocate("jakarta.inject", "${libPackage}.jakarta.inject")
    relocate("org.bstats", "${libPackage}.bstats")

    minimize {
        // Providers referenced by generated Dagger classes must survive minimization.
        exclude dependency('jakarta.inject:jakarta.inject-api')
        subprojects.each {
            exclude project(it.path)
        }
    }
}

// Fail packaging early if DI providers disappear from the shaded artifact.
tasks.register('verifyShadedInjectionApi') {
    group = 'verification'
    description = 'Verify the shaded Paper plugin descriptor, bundled APIs and Dagger injection classes.'
    dependsOn tasks.named('shadowJar')

    doLast {
        def jarFile = tasks.named('shadowJar').get().archiveFile.get().asFile
        new java.util.zip.ZipFile(jarFile).withCloseable { zip ->
            ['javax', 'jakarta'].each { namespace ->
                def entry = "net/benwoodworth/fastcraft/lib/${namespace}/inject/Provider.class"
                if (zip.getEntry(entry) == null) {
                    throw new GradleException("Missing ${entry} in ${jarFile.name}; verify Shadow dependencies/relocation.")
                }
            }

            // Only one plugin metadata descriptor may be shipped in the fat JAR.
            def entries = java.util.Collections.list(zip.entries())
            def descriptors = entries.findAll { it.name == 'paper-plugin.yml' }
            if (entries.any { it.name == 'plugin.yml' }) {
                throw new GradleException("Legacy plugin.yml must not be packaged in ${jarFile.name}.")
            }
            if (descriptors.size() != 1) {
                throw new GradleException("Expected one paper-plugin.yml in ${jarFile.name}, found ${descriptors.size()}.")
            }
            def descriptor = zip.getInputStream(descriptors.first()).withCloseable { input ->
                input.getText('UTF-8')
            }
            if (!descriptor.contains('main: "net.benwoodworth.fastcraft.paper.FastCraftPaper"') ||
                    !descriptor.contains('api-version: "1.21.11"')) {
                throw new GradleException("The shaded paper-plugin.yml must target FastCraftPaper on Paper 1.21.11.")
            }

            // Paper provides its own API. Shading server API classes is an invalid distribution.
            def leakedApi = entries.find {
                it.name.startsWith('org/bukkit/') || it.name.startsWith('io/papermc/paper/')
            }
            if (leakedApi != null) {
                throw new GradleException("Bundled Paper/Bukkit API class ${leakedApi.name} in ${jarFile.name}.")
            }
        }
    }
}

tasks.named('assemble') {
    dependsOn tasks.named('verifyShadedInjectionApi')
}

/**
 * Run the complete shaded plugin inside a local Paper 1.21.11 server.
 * Run Paper automatically detects the project's shadowJar task.
 */
tasks.named('runServer') {
    dependsOn tasks.named('verifyShadedInjectionApi')
    minecraftVersion('1.21.11')
    jvmArguments.add('-Dcom.mojang.eula.agree=true')
    jvmArguments.add('-Dnet.kyori.ansi.colorLevel=truecolor')
    jvmArguments.add('-Dfile.encoding=UTF8')
    systemProperty('terminal.jline', false)
    systemProperty('terminal.ansi', true)
}
