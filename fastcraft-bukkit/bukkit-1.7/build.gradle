repositories {
    flatDir { dirs "libs" }
}

dependencies {
    compileOnly 'org.spigotmc:spigot-api:1.7.10-R0.1-SNAPSHOT'

    // Gradle does not put compileOnly dependencies on test classpaths.
    // Test code mocks Player, so it must compile and run against the same Bukkit API.
    testImplementation 'org.spigotmc:spigot-api:1.7.10-R0.1-SNAPSHOT'

    api project(':fastcraft-bukkit:bukkit-platform')

    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}
