dependencies {
    // This module targets Java 21 (see module JVM selection in the root build.gradle).
    // The Paper API is supplied by the server; never bundle it in the plugin.
    compileOnly 'io.papermc.paper:paper-api:1.21.11-R0.1-SNAPSHOT'

    api project(':fastcraft-bukkit:bukkit-1.15')

    testImplementation 'io.papermc.paper:paper-api:1.21.11-R0.1-SNAPSHOT'
    // MockBukkit provides a RegistryAccess service for Paper API static initialization.
    // Keep its JUnit 6 runtime aligned with this module's test engine.
    testImplementation 'org.mockbukkit.mockbukkit:mockbukkit-v1.21:4.110.0'
    testImplementation 'org.junit.jupiter:junit-jupiter:6.0.3'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}
