repositories {
    maven { url 'https://repo.papermc.io/repository/maven-public/' }
}

dependencies {
    // The sole supported server target; do not compile against historical Spigot APIs.
    compileOnly 'io.papermc.paper:paper-api:1.21.11-R0.1-SNAPSHOT'
    api project(':fastcraft-bukkit')
    // Remaining legacy adapter dependency, to be ported to Paper next.
    implementation project(':fastcraft-bukkit:bukkit-1.7')

    testImplementation 'io.papermc.paper:paper-api:1.21.11-R0.1-SNAPSHOT'
    // RegistryAccess is provided by MockBukkit during Paper API tests.
    testImplementation 'org.mockbukkit.mockbukkit:mockbukkit-v1.21:4.110.0'
    testImplementation 'org.junit.jupiter:junit-jupiter:6.0.3'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

processResources {
    filesMatching('plugin.yml') {
        expand([
            plugin_author: plugin_author,
            plugin_description: plugin_description,
            plugin_version: rootProject.version,
            plugin_website: plugin_website
        ])
    }
}
