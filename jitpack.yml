# JitPack launches install commands in separate shells. Select the JDK explicitly.
before_install:
  - git config --global --add safe.directory /build
  - sdk install java 25-tem
install:
  - export JAVA_HOME="$HOME/.sdkman/candidates/java/25-tem" && export PATH="$JAVA_HOME/bin:$PATH" && "$JAVA_HOME/bin/java" -version && ./gradlew clean build verifyShadedInjectionApi publishToMavenLocal --stacktrace
